# Sorted as a Home Assistant app (add-on).
# Bump `version` whenever you copy a new build over, then press Rebuild.
name: Sorted
version: "1.0.0"
slug: sorted
description: Family chores, points and streaks. Served on port 8080.
arch:
  - aarch64
startup: application
boot: auto
# Docker's own init (tini) runs run.sh; the image doesn't use s6.
init: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Sorted web page
webui: "http://[HOST]:[PORT:8080]/"
# Laravel's /up health route. If it stops answering, HA restarts the app
# (only when Watchdog is switched on in the app's Info tab).
watchdog: "http://[HOST]:[PORT:8080]/up"
# The SQLite database is a single file in /data. A cold backup stops the app
# for a few seconds so the file is never copied half-written.
backup: cold
