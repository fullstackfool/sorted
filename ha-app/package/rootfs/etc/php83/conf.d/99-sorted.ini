; Sorted PHP settings (Pi-friendly).
expose_php = Off
display_errors = Off
log_errors = On

; OPcache: keep compiled PHP in memory. The code never changes inside the
; image, so there's no need to re-check files on every request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 32
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
