; One small pool. "ondemand" starts PHP workers only when a request comes in
; and stops them after a minute idle, so Sorted uses almost no RAM between taps.
[www]
user = nginx
group = nginx
listen = 127.0.0.1:9000

pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 60s
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no

php_admin_value[memory_limit] = 128M
